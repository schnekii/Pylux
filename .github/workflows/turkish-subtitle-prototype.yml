name: Turkish subtitle prototype APK

on:
  push:
    branches:
      - feature/turkish-subtitle-translation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --licenses || true

      - name: Install Android build packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --install \
            "ndk;28.2.13676358" \
            "cmake;3.30.4" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Install protobuf tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          python3 -m pip install --break-system-packages 'protobuf>=5,<6' 'grpcio-tools>=1.60'

      - name: Configure Android SDK path
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --parallel --build-cache -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pylux-turkish-subtitle-prototype
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
